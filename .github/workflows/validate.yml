name: Validate artwork and website

on:
  pull_request:
    paths:
      - "art/**"
      - "site/**"
      - "scripts/build_site.rb"
      - "templates/work/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate metadata and build website
        run: ruby scripts/build_site.rb _site
